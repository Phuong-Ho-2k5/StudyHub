name: StudyHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: studyhub_test
          POSTGRES_USER: studyhub_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyhub_test -d studyhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/studyhub_test
      PGVECTOR_TEST_USER: studyhub_test
      PGVECTOR_TEST_PASSWORD: ci_test_only
      AI_SIMULATION_URL: http://127.0.0.1:4900
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Postman CLI for local dependency simulation
        run: npm install --global postman-cli@1.73.0
      - name: Start AI extraction simulation
        run: |
          postman simulation run infra/testing/docling/extraction.sim.yaml --port 4900 --output ndjson > "$RUNNER_TEMP/docling-simulation.ndjson" 2> "$RUNNER_TEMP/docling-simulation.err" &
          for attempt in $(seq 1 30); do
            if node -e "require('net').connect(4900, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/docling-simulation.err"
          exit 1
      - name: Backend tests, PostgreSQL migrations and build
        working-directory: backend
        run: bash mvnw -B -Ppgvector-it verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test --test-reporter=junit --test-reporter-destination=test-results.xml src/api/*.test.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: |
            frontend/test-results.xml
            frontend/dist/

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Build AI service image
        run: docker build -t studyhub-ai:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-test-reports
          path: ai-service/test-results.xml
