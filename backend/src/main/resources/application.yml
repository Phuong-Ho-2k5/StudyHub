spring:
  application:
    name: studyhub-backend
  profiles:
    default: local
  task:
    scheduling:
      pool:
        size: 2
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:21MB}

studyhub:
  ingestion:
    worker-enabled: ${DOCUMENT_INGESTION_WORKER_ENABLED:true}
    poll-delay-ms: ${DOCUMENT_INGESTION_POLL_DELAY_MS:1000}
    lease-seconds: ${DOCUMENT_INGESTION_LEASE_SECONDS:600}
    max-attempts: ${DOCUMENT_INGESTION_MAX_ATTEMPTS:3}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:240}
    chat-timeout-seconds: ${AI_CHAT_TIMEOUT_SECONDS:75}
    llm-model: ${LLM_MODEL:gpt-4.1-mini}
    embedding-model: ${AI_EMBEDDING_MODEL:intfloat/multilingual-e5-small}@${AI_EMBEDDING_REVISION:614241f622f53c4eeff9890bdc4f31cfecc418b3}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:384}
  storage:
    root: ${DOCUMENT_STORAGE_ROOT:uploads/documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: false
