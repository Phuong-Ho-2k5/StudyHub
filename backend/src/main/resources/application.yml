spring:
  application:
    name: studyhub-backend
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
