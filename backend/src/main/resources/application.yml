spring:
  application:
    name: studyhub-backend
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:21MB}

studyhub:
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:240}
  storage:
    root: ${DOCUMENT_STORAGE_ROOT:uploads/documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: false
