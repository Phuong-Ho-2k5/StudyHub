services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyhub}
      POSTGRES_USER: ${POSTGRES_USER:-studyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can dien POSTGRES_PASSWORD trong .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-studyhub}
      POSTGRES_USER: ${POSTGRES_USER:-studyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can dien POSTGRES_PASSWORD trong .env}
      JWT_SECRET: ${JWT_SECRET:?Can dien JWT_SECRET trong .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      DOCUMENT_STORAGE_ROOT: /app/uploads/documents
      DOCUMENT_MAX_FILE_SIZE: ${DOCUMENT_MAX_FILE_SIZE:-20MB}
      DOCUMENT_MAX_REQUEST_SIZE: ${DOCUMENT_MAX_REQUEST_SIZE:-21MB}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-240}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      AI_EMBEDDING_REVISION: ${AI_EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-384}
    volumes:
      - document_files:/app/uploads/documents
    depends_on:
      db:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_MAX_FILE_BYTES: ${AI_MAX_FILE_BYTES:-20971520}
      AI_MAX_PAGES: ${AI_MAX_PAGES:-200}
      AI_EXTRACTION_TIMEOUT_SECONDS: ${AI_EXTRACTION_TIMEOUT_SECONDS:-180}
      AI_PICTURE_DESCRIPTIONS: ${AI_PICTURE_DESCRIPTIONS:-false}
      AI_PICTURE_MODEL: ${AI_PICTURE_MODEL:-HuggingFaceTB/SmolVLM-256M-Instruct}
      AI_CHUNK_TOKENIZER_MODEL: ${AI_CHUNK_TOKENIZER_MODEL:-intfloat/multilingual-e5-small}
      AI_CHUNK_MAX_TOKENS: ${AI_CHUNK_MAX_TOKENS:-384}
      AI_CHUNK_OVERLAP_TOKENS: ${AI_CHUNK_OVERLAP_TOKENS:-48}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      AI_EMBEDDING_REVISION: ${AI_EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-384}
      AI_EMBEDDING_TIMEOUT_SECONDS: ${AI_EMBEDDING_TIMEOUT_SECONDS:-120}
    volumes:
      - ai_model_cache:/home/appuser/.cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  document_files:
  ai_model_cache:
