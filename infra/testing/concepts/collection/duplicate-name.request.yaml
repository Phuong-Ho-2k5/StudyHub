$kind: http-request
name: Reject a duplicate Concept name
order: 5600
method: POST
url: '{{baseUrl}}/api/courses/{{courseId}}/documents/{{documentId}}/ai/concept-suggestions/{{duplicateBatchId}}/items/{{duplicateItemId}}/confirm'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"name":{{approvedNameJson}},"description":"Reviewed description"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Duplicate name does not replace existing Concept', () => pm.response.to.have.status(409));
