$kind: http-request
name: Reject stale pending suggestion
order: 8000
method: POST
url: '{{baseUrl}}/api/courses/{{staleCourseId}}/documents/{{staleDocumentId}}/ai/concept-suggestions/{{staleBatchId}}/items/{{staleItemId}}/confirm'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{staleAccessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"name":"Stale review","description":"Reviewed description"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Stale source requires regeneration', () => pm.response.to.have.status(409));
