{
  "$kind": "http-request",
  "name": "course",
  "order": 7000,
  "method": "POST",
  "url": "{{baseUrl}}/api/courses/{{courseId}}/ai/generate-quiz",
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    },
    {
      "key": "Idempotency-Key",
      "value": "{{fixtureKey}}-course"
    }
  ],
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('accepted asynchronously',()=>{pm.response.to.have.status(202);pm.expect(pm.response.headers.get('Location')).to.eql(pm.response.json().statusUrl);});\nconst accepted=pm.response.json();\npm.expect(accepted.jobId).to.match(/^[0-9a-f-]{36}$/i);\nconst base=pm.variables.get('baseUrl'), token=pm.variables.get('accessToken');\nconst get=url=>new Promise((resolve,reject)=>pm.sendRequest({url,method:'GET',header:{Authorization:'Bearer '+token}},(error,response)=>error?reject(error):resolve(response)));\nlet job;\nfor(let attempt=0;attempt<100;attempt++) {\n const response=await get(base+'/api/ai/jobs/'+accepted.jobId);\n pm.expect(response.code).to.eql(200);job=response.json();\n if(['COMPLETED','FAILED'].includes(job.status))break;\n await new Promise(resolve=>setTimeout(resolve,100));\n}\npm.test('job completes within bounded polling',()=>pm.expect(job.status).to.eql('COMPLETED'));\nif(job.status!=='COMPLETED')throw new Error('AI job did not complete: '+job.status);\nconst metadata=(await get(base+'/api/quizzes/'+job.result.id+'/ai-generation')).json();pm.test('explicit multi-document coverage',()=>pm.expect(metadata.coverage.length).to.eql(2));"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\"title\":\"Course revision\",\"questionCount\":1,\"documentIds\":[{{documentId}},{{secondDocumentId}}],\"chunkLimit\":2}"
  }
}
