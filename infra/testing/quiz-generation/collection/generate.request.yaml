{
  "$kind": "http-request",
  "name": "generate",
  "order": 1000,
  "method": "POST",
  "url": "{{baseUrl}}/api/documents/{{documentId}}/ai/generate-quiz",
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    },
    {
      "key": "Idempotency-Key",
      "value": "{{fixtureKey}}"
    }
  ],
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('accepted asynchronously',()=>{pm.response.to.have.status(202);pm.expect(pm.response.headers.get('Location')).to.eql(pm.response.json().statusUrl);});\nconst accepted=pm.response.json();\npm.expect(accepted.jobId).to.match(/^[0-9a-f-]{36}$/i);\nconst base=pm.variables.get('baseUrl'), token=pm.variables.get('accessToken');\nconst get=url=>new Promise((resolve,reject)=>pm.sendRequest({url,method:'GET',header:{Authorization:'Bearer '+token}},(error,response)=>error?reject(error):resolve(response)));\nlet job;\nfor(let attempt=0;attempt<100;attempt++) {\n const response=await get(base+'/api/ai/jobs/'+accepted.jobId);\n pm.expect(response.code).to.eql(200);job=response.json();\n if(['COMPLETED','FAILED'].includes(job.status))break;\n await new Promise(resolve=>setTimeout(resolve,100));\n}\npm.test('job completes within bounded polling',()=>pm.expect(job.status).to.eql('COMPLETED'));\nif(job.status!=='COMPLETED')throw new Error('AI job did not complete: '+job.status);\npm.collectionVariables.set('jobId',accepted.jobId);\nconst quizResponse=await get(base+'/api/quizzes/'+job.result.id);const quiz=quizResponse.json();\nconst metadataResponse=await get(base+'/api/quizzes/'+job.result.id+'/ai-generation');const metadata=metadataResponse.json();\npm.test('saved draft and verified evidence',()=>{pm.expect(quizResponse.code).to.eql(200);pm.expect(quiz.status).to.eql('DRAFT');pm.expect(quiz.sourceType).to.eql('AI_GENERATED');pm.expect(metadata.evidence[0].citations[0].chunkId).to.eql(Number(pm.variables.get('chunkId')));});\npm.collectionVariables.set('quizId',String(quiz.id));pm.collectionVariables.set('sourceUrl',metadata.evidence[0].citations[0].sourceUrl);\n"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\"title\":\"Revision\",\"questionCount\":1}"
  }
}
