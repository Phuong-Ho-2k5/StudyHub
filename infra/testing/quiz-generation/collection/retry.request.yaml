{
  "$kind": "http-request",
  "name": "retry",
  "order": 2000,
  "method": "POST",
  "url": "{{baseUrl}}/api/documents/{{documentId}}/ai/generate-quiz",
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    },
    {
      "key": "Idempotency-Key",
      "value": "{{fixtureKey}}"
    }
  ],
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('same key returns original job',()=>{pm.response.to.have.status(202);pm.expect(pm.response.json().jobId).to.eql(pm.collectionVariables.get('jobId'));});"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\"title\":\"Revision\",\"questionCount\":1}"
  }
}
