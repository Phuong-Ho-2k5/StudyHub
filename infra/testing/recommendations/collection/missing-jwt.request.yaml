{
  "$kind": "http-request",
  "name": "missing-jwt",
  "order": 9000,
  "method": "GET",
  "url": "{{baseUrl}}/api/courses/{{courseId}}/recommendations/next-concepts",
  "scripts": [
    {
      "type": "afterResponse",
